<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage — Hierarchy of Execution</title>
<style>
  :root { color-scheme: light; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; background: #faf9f7; color: #1a1a1a; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #777; margin: 0 0 24px; }
  .ranges { display: flex; gap: 8px; margin-bottom: 24px; }
  .ranges button { border: 1px solid #ccc; background: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .ranges button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  section { margin-bottom: 32px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #999; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 200px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 6px; }
  .row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 14px; background: #d9c494; border-radius: 3px; min-width: 2px; }
  .row .n { text-align: right; color: #666; font-variant-numeric: tabular-nums; }
  .stat { display: inline-block; margin-right: 28px; }
  .stat b { font-size: 22px; display: block; }
  .stat span { color: #888; font-size: 12px; }
  .empty { color: #999; }
  code { background: #eee; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Usage</h1>
  <p class="sub">Which parts of the app get used. Counts only — <a href="/">back to app</a></p>

  <div class="ranges" id="ranges">
    <button data-days="1">24h</button>
    <button data-days="7" class="on">7d</button>
    <button data-days="30">30d</button>
    <button data-days="90">90d</button>
  </div>

  <section>
    <div id="totals"></div>
  </section>

  <section>
    <h2>By event</h2>
    <div id="byEvent"></div>
  </section>

  <section>
    <h2>By event + target</h2>
    <div id="byTarget"></div>
  </section>

  <section>
    <h2>Per day</h2>
    <div id="byDay"></div>
  </section>
</div>

<script>
  let days = 7;

  function bars(el, rows, keyFn) {
    if (!rows || rows.length === 0) { el.innerHTML = '<p class="empty">No events yet.</p>'; return; }
    const max = Math.max(...rows.map(r => r.n));
    el.innerHTML = rows.map(r => {
      const w = Math.round((r.n / max) * 100);
      return '<div class="row"><span class="label">' + keyFn(r) + '</span><div class="bar" style="width:' + w + '%"></div><span class="n">' + r.n + '</span></div>';
    }).join('');
  }

  async function load() {
    const res = await fetch('/api/events/summary?days=' + days);
    if (!res.ok) { document.getElementById('totals').innerHTML = '<p class="empty">Failed to load.</p>'; return; }
    const d = await res.json();
    const totalEv = (d.byEvent || []).reduce((s, r) => s + r.n, 0);
    document.getElementById('totals').innerHTML =
      '<div class="stat"><b>' + totalEv + '</b><span>events</span></div>' +
      '<div class="stat"><b>' + (d.sessions || 0) + '</b><span>sessions</span></div>' +
      '<div class="stat"><b>' + (d.byEvent ? d.byEvent.length : 0) + '</b><span>distinct events</span></div>';
    bars(document.getElementById('byEvent'), d.byEvent, r => r.event);
    bars(document.getElementById('byTarget'), d.byTarget, r => r.event + ' &middot; <code>' + (r.target || '') + '</code>');
    bars(document.getElementById('byDay'), d.byDay, r => r.day);
  }

  document.getElementById('ranges').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    days = Number(b.dataset.days);
    [...document.querySelectorAll('#ranges button')].forEach(x => x.classList.toggle('on', x === b));
    load();
  });

  load();
</script>
</body>
</html>
