name: keep-alive

# Pings the Render free instance around the clock so it never idles long
# enough to spin down (Render free web services sleep after ~15 min of
# inactivity, which otherwise costs a 30-50s cold start on the next visit).
# GitHub's scheduler is best-effort and can lag 10-30 min under load, and
# a repo with zero commits for 60 days has its scheduled workflows disabled
# by GitHub — a commit (or a manual "Run workflow") re-enables it.
# cron-job.org / UptimeRobot are a good free backup if cold starts still bite.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: hit /healthz
        run: |
          curl -sS -m 60 --retry 2 --retry-delay 5 \
            -o /dev/null -w "healthz -> %{http_code} in %{time_total}s\n" \
            https://priority-task-manager.onrender.com/healthz
